# 개인정보 설정 파일 (Wi-Fi / API 키)
#
# 이 파일은 SD카드의  /yaml/SC_SecConfig.yaml  경로에 두어야 합니다.
#
# !! 주의 !!
#   - 이 파일에는 실제 API 키가 들어갑니다. git에 커밋하지 마세요.
#   - 아래 ******** 부분만 본인 값으로 바꾸고, 따옴표는 그대로 유지하세요.
#   - Wi-Fi는 2.4GHz 대역만 사용할 수 있습니다 (ESP32는 5GHz 미지원).

wifi:
  ssid: "********"
  password: "********"

apikey:
  # 한국어 구성(LLM=ChatGPT, STT=Whisper, TTS=OpenAI TTS)에서는
  # 세 항목 모두 같은 OpenAI API 키(sk-...)를 넣으면 됩니다.
  stt: "********"       # STT용 키   (OpenAI Whisper 사용 시 = OpenAI 키)
  aiservice: "********" # LLM용 키   (OpenAI ChatGPT = OpenAI 키)
  tts: "********"       # TTS용 키   (OpenAI TTS는 aiservice 키를 재사용하므로 값은 무관하지만
                        #             파서가 세 항목 존재를 요구하므로 비워두지 말고 채워둡니다)
