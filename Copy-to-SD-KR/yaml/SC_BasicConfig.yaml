# 기본 설정 파일 (서보 / 화면 / 전원)
#
# SD카드의  /yaml/SC_BasicConfig.yaml  경로에 둡니다.
# 이 프리셋은 M5Stack CoreS3 + MG90S(PWM 서보) 2개를 Port.C에 연결한 구성을 기준으로 합니다.
# 서보를 아직 연결하지 않았다면 그대로 두어도 부팅/대화에는 영향이 없습니다.

servo:
  pin:
    # CoreS3 포트별 GPIO
    #   PortA  X:1,  Y:2
    #   PortB  X:8,  Y:9
    #   PortC  X:18, Y:17   <-- 이 프리셋이 사용하는 포트
    # 좌우(pan)와 상하(tilt)가 뒤바뀌어 움직이면 x와 y 값을 서로 바꾸세요.
    x: 18
    y: 17
  center:
    # 서보 초기 위치 (SG90/MG90S 기준)
    x: 90
    y: 90
  offset:
    # 초기화 시 90도를 기준으로 +- 로 미세 조정
    x: 0
    y: 0
  lower_limit:
    # 가동 범위 하한 (SG90/MG90S: x 0, y 60)
    x: 0
    y: 60
  upper_limit:
    # 가동 범위 상한 (SG90/MG90S: x 180, y 90)
    x: 180
    y: 90
  speed:
    normal_mode:
      interval_min: 3000
      interval_max: 6000
      move_min: 500
      move_max: 1500
    sing_mode:
      interval_min: 500
      interval_max: 1000
      move_min: 500
      move_max: 1000

servo_type: "PWM" # "PWM": SG90 / MG90S 계열 PWM 서보
                  # "SCS": Feetech SCS0009
                  # "M5_SCS": M5StackChan 정품 서보

bluetooth:
  device_name: "M5StackBTSPK"
  starting_state: false
  start_volume: 100

auto_power_off_time: 0 # Core2 전용. 자동 전원 차단 시간(msec). 0이면 비활성.

balloon:
  # 말풍선 폰트 언어. 한국어 글자는 펌웨어가 efontKR 폰트로 직접 지정하므로
  # 여기 값은 아래 lyrics(노래 모드 가사)에만 영향을 줍니다.
  font_language: "Default"
  lyrics: # 최대 10개
  - "안녕하세요"
  - "저는 스타크챤이에요"
  - "Hello"
  - "こんにちは"

led_lr: 0   # 0:stereo, 1:left_only, 2:right_only
led_pin: 15 # Core2용 GoBottom 설정. CoreS3에서는 사용되지 않습니다.
takao_base: false # Stack-chan_Takao_Base 로 후면 커넥터 급전 시 true

secret_config_show: true # 시리얼 로그에 개인정보(Wi-Fi/API키)를 출력할지 여부.
                         # 정상 동작을 확인한 뒤에는 false 로 바꾸는 것을 권장합니다.
